<title>SchoolOS Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Mukta:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap">
<style>
/* Layout: screen index on the left, a device stage on the right that runs the real SchoolOS dashboard code. */
:root {
	--paper: #eef1f5;
	--panel: #ffffff;
	--ink: #16202c;
	--muted: #5a6677;
	--line: #d9dfe8;
	--accent: #2b5c8f;
	--accent-soft: #e2ebf5;
	--good: #157347; --good-bg: #d9f2e3;
	--warn: #a15c07; --warn-bg: #fdf0d5;
	--bad: #b3261e; --bad-bg: #fbe3e1;
	--wa-bg: #e9e2d8; --wa-in: #ffffff; --wa-head: #1f6e5c;
	--desk: #f7f8fa;
	--shadow: 0 1px 2px rgba(16, 32, 52, .06), 0 8px 24px rgba(16, 32, 52, .08);
	--f-ui: "Hanken Grotesk", "Mukta", system-ui, sans-serif;
	--f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
	:root:not([data-theme="light"]) {
		--paper: #0e131a; --panel: #161c25; --ink: #e5eaf1; --muted: #97a2b3; --line: #273142;
		--accent: #86b4e6; --accent-soft: #1b2a3c;
		--good: #5fd39a; --good-bg: #123323; --warn: #f0b75a; --warn-bg: #3a2a0d; --bad: #f28b82; --bad-bg: #3d1614;
		--wa-bg: #0b141a; --wa-in: #1f2c34; --wa-head: #1f2c34; --desk: #12171f;
		--shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
		color-scheme: dark;
	}
}
:root[data-theme="dark"] {
	--paper: #0e131a; --panel: #161c25; --ink: #e5eaf1; --muted: #97a2b3; --line: #273142;
	--accent: #86b4e6; --accent-soft: #1b2a3c;
	--good: #5fd39a; --good-bg: #123323; --warn: #f0b75a; --warn-bg: #3a2a0d; --bad: #f28b82; --bad-bg: #3d1614;
	--wa-bg: #0b141a; --wa-in: #1f2c34; --wa-head: #1f2c34; --desk: #12171f;
	--shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
	color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 15px/1.45 var(--f-ui); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.shell { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: 100vh; }
.index {
	border-right: 1px solid var(--line); background: var(--panel);
	padding-block: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px;
	position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto;
}
.wordmark { font-weight: 700; font-size: 18px; letter-spacing: -.01em; }
.wordmark small { display: block; font: 500 11px/1.4 var(--f-mono); color: var(--muted); letter-spacing: .04em; text-transform: uppercase; margin-top: 2px; }
.group { margin-top: 18px; }
.group h4 { margin: 0 0 6px; font: 600 11px var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.nav { display: grid; gap: 2px; }
.nav button {
	text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 8px; cursor: pointer;
	display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--ink);
}
.nav button:hover { background: var(--accent-soft); }
.nav button[aria-current="true"] { background: var(--accent); color: var(--panel); font-weight: 600; }
.nav .kind { font: 500 10px var(--f-mono); opacity: .7; text-transform: uppercase; letter-spacing: .06em; }
.legend { margin-top: 22px; font-size: 12px; color: var(--muted); line-height: 1.5; }
.legend b { color: var(--ink); }

.stage { min-width: 0; padding-block: 20px 40px; padding-left: 24px; padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.stagehead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; max-width: 1180px; margin: 0 auto 14px; }
.stagehead h1 { margin: 0; font-size: 22px; letter-spacing: -.01em; text-wrap: balance; }
.stagehead p { margin: 4px 0 0; color: var(--muted); max-width: 64ch; }
.who { font: 600 11px var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--panel); }
.seg button { border: 0; background: none; padding: 5px 12px; border-radius: 999px; cursor: pointer; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }

.frame-wrap { display: flex; justify-content: center; }
.phone {
	width: 390px; max-width: 100%; height: 780px; border-radius: 40px; padding: 12px; background: #11161d;
	box-shadow: var(--shadow); position: relative;
}
.phone::before { content: ""; position: absolute; top: 20px; left: 50%; transform: translateX(-50%); width: 90px; height: 22px; border-radius: 12px; background: #000; z-index: 3; }
.phone .screen { border-radius: 30px; }
.desktop { width: 100%; max-width: 1180px; border-radius: 12px; background: var(--panel); box-shadow: var(--shadow); border: 1px solid var(--line); overflow: hidden; }
.desktop .chrome { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--desk); }
.desktop .chrome i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); display: block; }
.desktop .url { flex: 1; margin-left: 10px; font: 12px var(--f-mono); color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.screen { height: 100%; overflow-y: auto; overflow-x: hidden; background: var(--panel); position: relative; }
.desktop .screen { height: 760px; }
.phone .screen { padding-top: 26px; background: var(--brand-shell, #1f3a5f); }

.toast {
	position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px);
	background: var(--ink); color: var(--panel); padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0;
	transition: opacity .2s, transform .2s; pointer-events: none; z-index: 50; max-width: calc(100% - 32px);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }

/* ---------- desk (admin) wireframes */
.desk { background: var(--desk); min-height: 100%; font-size: 14px; }
.desk-top { display: flex; align-items: center; gap: 10px; padding: 10px 18px; border-bottom: 1px solid var(--line); background: var(--panel); }
.desk-top .crumb { color: var(--muted); font-size: 13px; }
.desk-top .crumb b { color: var(--ink); }
.desk-top .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.desk-body { padding: 18px; display: grid; gap: 14px; max-width: 980px; }
.dcard { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
.dcard h3 { margin: 0 0 12px; font-size: 14px; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px 18px; }
.field { display: grid; gap: 4px; }
.field label { font-size: 12px; color: var(--muted); }
.field input, .field select, .field textarea { border: 1px solid var(--line); background: var(--desk); border-radius: 6px; padding: 7px 9px; width: 100%; }
.field .hint { font-size: 12px; color: var(--muted); }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; }
.check input { margin-top: 3px; }
.dbtn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
.dbtn.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.dbtn:disabled { opacity: .5; cursor: default; }
.dtable { width: 100%; border-collapse: collapse; font-size: 13px; }
.dtable th, .dtable td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.dtable th { font: 600 11px var(--f-mono); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.dtable td.num, .dtable th.num { text-align: right; font-variant-numeric: tabular-nums; }
.dtable input { width: 58px; border: 1px solid var(--line); border-radius: 5px; padding: 3px 5px; background: var(--desk); text-align: right; }
.scrollx { overflow-x: auto; }
.st { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.st.good { background: var(--good-bg); color: var(--good); }
.st.warn { background: var(--warn-bg); color: var(--warn); }
.st.bad { background: var(--bad-bg); color: var(--bad); }
.st.info { background: var(--accent-soft); color: var(--accent); }
.log { font: 12px/1.6 var(--f-mono); background: var(--desk); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; max-height: 260px; overflow: auto; }
.log .e { color: var(--bad); } .log .n { color: var(--warn); }
.bar { height: 8px; background: var(--line); border-radius: 6px; overflow: hidden; }
.bar span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.kv div { background: var(--desk); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.kv b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
.kv span { font-size: 12px; color: var(--muted); }
.modal { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 16px; box-shadow: var(--shadow); }
.toggle { display: flex; gap: 6px; flex-wrap: wrap; }
.toggle button { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 13px; min-width: 34px; }
.toggle button.p { background: var(--good-bg); color: var(--good); border-color: transparent; font-weight: 600; }
.toggle button.a { background: var(--bad-bg); color: var(--bad); border-color: transparent; font-weight: 600; }
.toggle button.l { background: var(--warn-bg); color: var(--warn); border-color: transparent; font-weight: 600; }
.swatch { width: 38px; height: 34px; padding: 0; border: 1px solid var(--line); border-radius: 6px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* ---------- paper (report card) */
.paper-wrap { background: #c9ced6; padding: 18px; min-height: 100%; }
.paper { background: #fff; color: #111; max-width: 800px; margin: 0 auto; padding: 28px 30px; box-shadow: 0 2px 10px rgba(0,0,0,.2); overflow-x: auto; }

/* ---------- WhatsApp & email */
.wa { background: var(--wa-bg); min-height: 100%; display: flex; flex-direction: column; }
.wa-head { background: var(--wa-head); color: #fff; padding: 10px 14px; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; }
.wa-av { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; flex: none; }
.wa-head small { display: block; opacity: .8; font-size: 12px; }
.wa-body { padding: 12px; display: grid; gap: 10px; align-content: start; }
.wa-day { justify-self: center; font-size: 11px; background: var(--wa-in); color: var(--muted); padding: 3px 10px; border-radius: 8px; }
.wa-msg { background: var(--wa-in); color: var(--ink); border-radius: 0 10px 10px 10px; padding: 8px 10px 4px; max-width: 88%; box-shadow: 0 1px 0 rgba(0,0,0,.08); font-size: 14px; }
.wa-msg .meta { font-size: 10px; color: var(--muted); text-align: right; margin-top: 2px; }
.wa-msg .tag { display: inline-block; font: 600 10px var(--f-mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
.wa-msg a { color: #2a7fd4; word-break: break-all; }
.mail { display: grid; grid-template-columns: 260px minmax(0, 1fr); min-height: 100%; }
.mail-list { border-right: 1px solid var(--line); }
.mail-list button { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: var(--panel); padding: 10px 12px; cursor: pointer; }
.mail-list button[aria-current="true"] { background: var(--accent-soft); }
.mail-list b { display: block; font-size: 13px; }
.mail-list span { font-size: 12px; color: var(--muted); display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.mail-view { padding: 18px 20px; min-width: 0; }
.mail-view h3 { margin: 0 0 4px; font-size: 17px; }
.mail-view .from { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
.mail-view .bodytext { line-height: 1.6; max-width: 62ch; }

/* ---------- home screen */
.home { min-height: 100%; background: linear-gradient(160deg, #24415f, #4a2f5e 60%, #7a4c4c); padding: 40px 22px; color: #fff; }
.home .time { text-align: center; font-size: 54px; font-weight: 300; letter-spacing: -.02em; }
.home .date { text-align: center; opacity: .85; margin-bottom: 36px; }
.icons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px 12px; }
.icon { display: grid; justify-items: center; gap: 6px; font-size: 11px; border: 0; background: none; color: #fff; cursor: pointer; padding: 0; }
.icon i { width: 58px; height: 58px; border-radius: 15px; display: grid; place-items: center; font-style: normal; font-weight: 700; font-size: 18px; background: rgba(255,255,255,.18); }
.icon.school i { box-shadow: 0 0 0 3px rgba(255,255,255,.6); }
.home .note { margin-top: 34px; background: rgba(0,0,0,.28); border-radius: 14px; padding: 12px 14px; font-size: 13px; line-height: 1.5; }

@media (max-width: 860px) {
	.shell { grid-template-columns: 1fr; }
	.index { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
	.groups { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 4px; }
	.group { margin-top: 12px; flex: none; }
	.nav { display: flex; gap: 4px; }
	.nav button { white-space: nowrap; }
	.nav .kind, .legend { display: none; }
	.stage { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
	.mail { grid-template-columns: 1fr; }
	.mail-list { border-right: 0; border-bottom: 1px solid var(--line); }
}
@media (max-width: 430px) {
	.phone { padding: 0; border-radius: 0; height: 720px; box-shadow: none; }
	.phone::before { display: none; }
	.phone .screen { border-radius: 12px; padding-top: 0; }
}
/* demo Razorpay checkout */
.rzp { position: absolute; left: 0; right: 0; z-index: 20; background: rgba(10, 14, 20, .55); display: grid; place-items: center; padding: 16px; }
.rzp-card { background: #fff; color: #172033; width: 100%; max-width: 360px; border-radius: 14px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,.35); font: 14px/1.4 system-ui, sans-serif; }
.rzp-head { background: #072654; color: #fff; padding: 14px 16px; display: grid; gap: 2px; }
.rzp-head span { opacity: .8; font-size: 12px; }
.rzp-amt { font-size: 24px; font-weight: 700; margin-top: 4px; }
.rzp-body { padding: 12px 16px 14px; display: grid; gap: 8px; }
.rzp-k { font-size: 11px; font-weight: 700; color: #6b7a90; text-transform: uppercase; letter-spacing: .05em; margin-top: 4px; }
.rzp-opt { text-align: left; border: 1px solid #dfe4ee; background: #fff; border-radius: 10px; padding: 10px 12px; cursor: pointer; display: grid; color: #172033; }
.rzp-opt:hover { border-color: #3395ff; }
.rzp-opt span { font-size: 12px; color: #6b7a90; }
.rzp-x { border: 0; background: none; color: #6b7a90; cursor: pointer; padding: 6px; }
.rzp-note { margin: 0; text-align: center; font-size: 11px; color: #8a97ab; }
.rzp-done { width: 56px; height: 56px; border-radius: 50%; background: #1db954; color: #fff; display: grid; place-items: center; font-size: 28px; margin: 22px auto 8px; }
#screen > .lightbox-host { position: sticky; top: 0; height: 0; z-index: 60; min-height: 0 !important; background: transparent !important; }
#screen > .lightbox-host .lightbox { position: absolute; inset: auto; top: 0; left: 0; right: 0; height: var(--lbh); border-radius: inherit; }
.dl-card { background: var(--panel); color: var(--ink); width: 100%; max-width: 620px; border-radius: 12px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
.dl-head { background: var(--ink); color: var(--panel); padding: 12px 16px; display: grid; gap: 2px; }
.dl-head span { font: 12px var(--f-mono); opacity: .8; word-break: break-all; }
.dl-body { padding: 12px 16px 16px; display: grid; gap: 10px; max-height: 70vh; overflow: auto; }
.xmlpre { font: 11px/1.5 var(--f-mono); background: var(--desk); border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin: 0; white-space: pre-wrap; word-break: break-all; max-height: 46vh; overflow: auto; }
.modgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.modsw { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; background: var(--desk); }
.modsw input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.modsw .sw { width: 38px; height: 22px; border-radius: 999px; background: var(--line); position: relative; flex: none; transition: background .15s; }
.modsw .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.modsw input:checked + .sw { background: var(--good); }
.modsw input:checked + .sw::after { transform: translateX(16px); }
.modsw input:focus-visible + .sw { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .modsw .sw, .modsw .sw::after { transition: none; } }
/*APP_CSS*/
</style>

<div class="shell">
	<aside class="index">
		<div class="wordmark" id="wm">Demo Public School<small>SchoolOS · working prototype</small></div>
		<div class="groups" id="groups"></div>
		<p class="legend"><b>App</b> screens run the real SchoolOS dashboard code with demo data. <b>Desk</b> screens are working mockups of the school office tools. Nothing here is saved.</p>
	</aside>
	<main class="stage">
		<div class="stagehead">
			<div>
				<div class="who" id="who"></div>
				<h1 id="title"></h1>
				<p id="desc"></p>
			</div>
			<div class="seg" id="devseg" role="group" aria-label="Device">
				<button type="button" data-dev="phone">Phone</button>
				<button type="button" data-dev="desktop">Desktop</button>
			</div>
		</div>
		<div class="frame-wrap" id="frame"></div>
	</main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/*APP_JS*/
</script>
<script>
/*HOST_JS*/
</script>
