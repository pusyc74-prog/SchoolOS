<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="{{ primary_color }}">
	<title>{{ school_name | e }}</title>
	{% if logo %}<link rel="icon" href="{{ logo }}">{% endif %}
	<link rel="manifest" href="/api/method/schoolos.api.pwa.manifest">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-title" content="{{ school_name | e }}">
	<link rel="apple-touch-icon" href="{{ logo or '/assets/schoolos/images/logo.svg' }}">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Mukta:wght@400;500;600;700&display=swap">
	<link rel="stylesheet" href="/assets/schoolos/css/school.css?v={{ version }}">
	<style>:root { --brand: {{ primary_color }}; }</style>
	<script>window.frappe = window.frappe || {};</script>
	<!-- csrf_token -->
</head>
<body>
	<header class="topbar">
		<div class="brand">
			{% if logo %}<img src="{{ logo }}" alt="" class="logo">{% endif %}
			<span class="school-name">{{ school_name | e }}</span>
		</div>
		<div class="user">
			<span id="user-name"></span>
			<a href="/desk" id="desk-link" class="hidden">Admin</a>
			<a href="/logout">Log out</a>
		</div>
	</header>
	<nav id="tabs" class="tabs" role="tablist"></nav>
	<main id="app">
		<div class="loading">Loading…</div>
	</main>
	<script src="/assets/schoolos/js/school.js?v={{ version }}"></script>
</body>
</html>
