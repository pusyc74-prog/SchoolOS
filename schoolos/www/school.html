<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="{{ primary_color }}">
	<title>{{ school_name | e }}</title>
	{% if logo %}<link rel="icon" href="{{ logo }}">{% endif %}
	<link rel="manifest" href="/api/method/schoolos.api.pwa.manifest">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-title" content="{{ school_name | e }}">
	<link rel="apple-touch-icon" href="{{ logo or '/assets/schoolos/images/logo.svg' }}">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap">
	<link rel="stylesheet" href="/assets/schoolos/css/school.css?v={{ version }}">
	<style>:root { --brand: {{ primary_color }}; }</style>
	<script>window.frappe = window.frappe || {};</script>
	<!-- csrf_token -->
</head>
<body>
	<div class="shell-app">
		<aside class="drawer" id="drawer" aria-label="Menu">
			<div class="drawer-head">
				<span class="drawer-logo">{% if logo %}<img src="{{ logo }}" alt="">{% else %}{{ school_name[:1] | e }}{% endif %}</span>
				<b class="school-name">{{ school_name | e }}</b>
			</div>
			<div class="profile"><span class="avatar" id="user-avatar"></span><div><b id="user-name"></b><span id="user-role"></span></div></div>
			<nav id="tabs" class="menu" aria-label="Sections"></nav>
			<div class="drawer-foot">
				<a href="/desk" id="desk-link" class="foot-link hidden">Admin</a>
				<a href="/logout" class="foot-link">Log out</a>
			</div>
		</aside>
		<div class="scrim" id="scrim"></div>
		<div class="main-col" id="main-col">
			<header class="appbar">
				<button type="button" class="icon-btn" id="menu-btn" aria-label="Menu"></button>
				<h1 id="page-title"></h1>
				<div class="appbar-actions"><span id="bell-slot"></span></div>
			</header>
			<main id="app"><div class="loading">Loading…</div></main>
			<nav class="bottom-nav" id="bottom-nav" aria-label="Sections"></nav>
		</div>
	</div>
	<script src="/assets/schoolos/js/school.js?v={{ version }}"></script>
</body>
</html>
